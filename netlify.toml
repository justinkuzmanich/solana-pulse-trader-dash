# Solana Trade Pulse — Netlify config
# Static frontend at repo root + serverless functions that hide all API keys.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Bundle the fee-account registry with every function so it reads one
  # source of truth (config/terminals.json) at runtime.
  included_files = ["config/terminals.json"]

# dune-refresh's schedule ("*/5 * * * *" tick; real Dune executions are
# cadence- and credit-gated) is declared in-code via `export const config`
# in netlify/functions/dune-refresh.ts. It never runs per page load.
